[package]
name = "NukeAV"
version = "2.0.0"
edition = "2024"
build = "build.rs"

[lib]
name = "NukeAV"
crate-type = ["cdylib"]

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
mp4 = "0.14"
webm-iterable = "0.6"

yuv = "0.8"
libc = "0.2"

[build-dependencies]
bindgen = "0.72"
cc = "1.2"
vcpkg = "0.2.15"
zip = "8.6.0"
