name: Build Plugin (macOS)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  build-macos:
    name: Build Plugin (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          target/vcpkg
          target/release/build
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('Cargo.toml', 'build.rs') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Cache vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: ${{ runner.os }}-vcpkg-binaries-${{ hashFiles('Cargo.toml', 'build.rs') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binaries-

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies (macOS)
      run: |
        brew install cmake ninja nasm

    - name: Download Adobe Premiere Pro SDK (macOS)
      shell: bash
      env:
        ADOBE_SDK_URL: ${{ secrets.ADOBE_SDK_URL }}
        ADOBE_SDK_TOKEN: ${{ secrets.ADOBE_SDK_TOKEN }}
      run: |
        mkdir -p sdk
        if [ -n "$ADOBE_SDK_URL" ]; then
          echo "Downloading Adobe SDK from secret URL..."
          if [ -n "$ADOBE_SDK_TOKEN" ]; then
            curl -L --fail -H "Authorization: Bearer $ADOBE_SDK_TOKEN" -o sdk/SDK.zip "$ADOBE_SDK_URL"
          else
            curl -L --fail -o sdk/SDK.zip "$ADOBE_SDK_URL"
          fi
          mv sdk/SDK.zip "sdk/Premiere Pro 26.0 C++ SDK Mac.zip"
        else
          echo "No ADOBE_SDK_URL secret provided. Checking if cached SDK is present..."
          if [ ! -f "sdk/Premiere Pro 26.0 C++ SDK Mac.zip" ]; then
            echo "ERROR: Adobe Premiere Pro SDK zip not found! Please set the ADOBE_SDK_URL secret."
            exit 1
          fi
        fi

    - name: Build plugin in Release Mode (macOS)
      run: cargo build --release

    - name: Parse cargo version
      id: get_version
      shell: bash
      run: |
        VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Package macOS Bundle
      shell: bash
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p output/NukeAV.bundle/Contents/MacOS

        # Copy compiled dynamic library as the bundle executable
        cp target/release/libNukeAV.dylib output/NukeAV.bundle/Contents/MacOS/NukeAV

        # Generate Info.plist dynamically
        cat <<EOF > output/NukeAV.bundle/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>English</string>
            <key>CFBundleExecutable</key>
            <string>NukeAV</string>
            <key>CFBundleIdentifier</key>
            <string>com.anarchbyte.NukeAV</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>NukeAV</string>
            <key>CFBundlePackageType</key>
            <string>Bndl</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
        </dict>
        </plist>
        EOF
        echo "macOS Bundle prepared at output/NukeAV.bundle"

        # Ad-hoc sign the bundle executable so it loads cleanly on macOS
        codesign --force -s - --identifier libNukeAV.dylib output/NukeAV.bundle/Contents/MacOS/NukeAV

        # Zip the bundle so it uploads as a single file asset
        cd output
        zip -r NukeAV-macOS.zip NukeAV.bundle
        echo "Zipped bundle at output/NukeAV-macOS.zip"

    - name: Upload macOS Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NukeAV-macOS-Artifact
        path: output/NukeAV-macOS.zip
        compression-level: 0
        if-no-files-found: error
